# pallet 데이터 경로 registry (Stage 2-A 도입)
#
# 규칙
#   - 여기 적힌 값은 "지금 실제로 존재하는 경로"다. 앞으로 가고 싶은 경로(TARGET)를 적지 않는다.
#     현 위치가 이상해 보여도(예: 현역 텍스처가 archive/ 아래) 실제 위치를 그대로 적는다.
#   - 경로는 프로젝트 루트 기준 상대경로. 해석은 scripts/data_prep/blender/pallet_data_paths.py.
#   - 환경변수 PALLET_DATA_ROOT 가 있으면 pallet_data_root 만 override 된다
#     (하위 경로는 root 기준으로 재조립된다).
#   - 존재하지 않는 경로는 적지 않는다. optional 로 표시된 항목만 부재를 허용한다.
#
# 파일 형식: config/synthetic/blender.yaml 과 마찬가지로 JSON 서브셋으로 파싱한다
#            (blender_config.py 가 .yaml 확장자에 json.loads 를 쓰는 저장소 관례를 따른다).
{
  "pallet_data_root": "data/pallet",

  "// 씬": "프로덕션 blend 는 동반 textures/ 와 같은 폴더에 있어야 한다",
  "// 씬 (Stage 2-C2)": "Stage 2-C2 에서 blender_scene 을 assets/scenes/production/ 아래로 옮기고 상대경로를 rebase 했다. rollback 사슬: stage2c2(active) -> stage2c1 portable -> original",
  "production_scene": "data/pallet/assets/scenes/production/blender_scene/synth_data_scene_portable_stage2c2.blend",
  "production_scene_stage2c1_rollback": "data/pallet/assets/scenes/production/blender_scene/synth_data_scene_portable.blend",
  "production_scene_rollback_source": "data/pallet/assets/scenes/production/blender_scene/synth_data_scene.blend",
  "production_scene_textures": "data/pallet/assets/scenes/production/blender_scene/textures",
  "experimental_scene": "data/pallet/assets/scenes/production/blender_scene/_sandbox_palletobj_production.blend",

  "// 배경": "Stage 2-C2 이동 완료. 원본 다운로드 ZIP 3개는 archive/packages/background_sources 로 먼저 분리했다",
  "background_root": "data/pallet/assets/scenes/backgrounds/background",
  "background_package_archive": "data/pallet/archive/packages/background_sources",

  "// 디스트랙터": "Stage 2-C2 이동 완료. blend 는 이 폴더를 //../../../distractors/library/ 상대경로로 356건 참조한다",
  "distractor_root": "data/pallet/assets/distractors/library",
  "distractor_manifest": "data/pallet/assets/distractors/library/distractors_manifest.csv",

  "// 조명": "Stage 2-B 이동 완료 (구 data/pallet/hdri)",
  "hdri_root": "data/pallet/assets/lighting/hdri/library",

  "// 머티리얼": "Stage 2-B 이동 완료 — archive/ 아래 있던 현역 텍스처를 정상 위치로",
  "floor_material_root": "data/pallet/assets/materials/floor/textures_floor",
  "pallet_material_root": "data/pallet/assets/materials/pallet/textures_wood",

  "// 팔레트 모델": "Stage 2-B 이동 완료 (구 models_usd / pallets_v2_add)",
  "pallet_model_roots": [
    "data/pallet/assets/pallets/models/models_usd",
    "data/pallet/assets/pallets/source/pallets_v2_add/models"
  ],
  "pallet_measurements": "data/pallet/assets/pallets/source/pallets_v2_add/measurements.json",

  "// 검증 정본": "Stage 2-B 이동 완료. tests/test_overlay_archive_trunc_style.py 가 픽셀 비교하는 정본",
  "golden_overlay_reference": "data/pallet/reference/golden_overlay/trunc_addon_v1_pilot",
  "real_data_root": "data/pallet/reference/real_images/real_data",

  "// 트리 루트": "Stage 2-A 에서 생성한 뼈대",
  "runs_root": "data/pallet/runs",
  "release_root": "data/pallet/release",
  "archive_root": "data/pallet/archive",
  "manifests_root": "data/pallet/manifests",
  "assets_root": "data/pallet/assets",
  "reference_root": "data/pallet/reference",

  "// legacy dataset": "Stage 2-D1.1: 여러 current runtime 이 독립적으로 참조하는 legacy 자료. 경로 리터럴 대신 이 키를 쓴다. archive/ 안에서 위치가 바뀌면 이 값 하나만 고친다",
  "legacy_training_data_root": "data/pallet/archive/training_data",
  "legacy_train_palletobj_v3_root": "data/pallet/archive/train_palletobj_v3",
  "legacy_train_palletobj_v3_post_v1_root": "data/pallet/archive/train_palletobj_v3_post_v1",
  "legacy_sandbox_parking_lot_scene": "data/pallet/assets/scenes/production/blender_scene/_sandbox_parking_lot_check.blend",

  "// optional": "부재를 허용하는 항목 (감사에서 missing 이 아니라 absent 로 보고)",
  "optional_keys": [
    "release_root",
    "pallet_measurements"
  ]
}
